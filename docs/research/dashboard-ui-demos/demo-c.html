// 自定义 Tooltip：白底细边圆角阴影，中文标签
const ChartTip = ({ active, payload, label, money }) => {
  if (!active || !payload || !payload.length) return null;
  return (
    <div className="rounded-lg border border-gray-200 bg-white px-3 py-2 shadow-lg">
      <p className="mb-1 text-xs font-bold text-gray-900">{label}</p>
      {payload.map((entry) => (
        <p key={entry.dataKey} className="text-xs text-gray-600">
          {entry.name}：
          <span className="font-bold text-gray-900">
            {money && entry.dataKey === 'amt' ? `¥${fmtMoney(entry.value)}` : `${fmtInt(entry.value)}${entry.dataKey === 'amt' ? '' : ' 单'}`}
          </span>
        </p>
      ))}
    </div>
  );
};

// 报告节骨架：编号 + 标题 + 结论句 + 内容
const Section = ({ no, title, conclusion, children, note }) => (
  <section className="border-t border-gray-100 pt-9 mt-9 first:border-t-0 first:pt-0 first:mt-0">
    <div className="flex items-baseline gap-3">
      <span className="text-xs font-bold tracking-widest text-gray-300">{no}</span>
      <h2 className="text-lg font-extrabold text-gray-900">{title}</h2>
    </div>
    <p className="mt-2.5 text-[15px] font-bold leading-relaxed text-gray-800">{conclusion}</p>
    {note && <p className="mt-1 text-xs leading-relaxed text-gray-400">{note}</p>}
    <div className="mt-5">{children}</div>
  </section>
);

/* ---------------- 图表：24 小时分布（0 值弱化为浅底座，峰值黄+数值） ---------------- */
const HourChart = ({ hours }) => {
  const rows = Array.from({ length: 24 }, (_, h) => ({ label: `${h}时`, raw: hours[h] || 0 }));
  const max = Math.max(...rows.map((r) => r.raw), 1);
  const floor = max * 0.04; // 0 值画极浅短底座，避免一排空柱
  const data = rows.map((r) => ({ ...r, v: r.raw === 0 ? floor : r.raw }));
  return (
    <div className="h-[210px]">
      <ResponsiveContainer width="100%" height="100%" initialDimension={{ width: 720, height: 210 }}>
        <ComposedChart data={data} margin={{ top: 18, right: 4, left: -20, bottom: 0 }}>
          <CartesianGrid vertical={false} stroke="#F3F4F6" strokeDasharray="3 3" />
          <XAxis dataKey="label" axisLine={false} tickLine={false} tick={{ fill: '#9CA3AF', fontSize: 10 }} interval={2} />
          <YAxis allowDecimals={false} axisLine={false} tickLine={false} tick={{ fill: '#9CA3AF', fontSize: 11 }} domain={[0, Math.ceil(max * 1.15)]} />
          <Tooltip content={({ active, payload, label }) => {
            if (!active || !payload || !payload.length) return null;
            const raw = payload[0].payload.raw;
            return (
              <div className="rounded-lg border border-gray-200 bg-white px-3 py-2 shadow-lg">
                <p className="text-xs font-bold text-gray-900">{label}</p>
                <p className="text-xs text-gray-600">订单数：<span className="font-bold text-gray-900">{raw} 单</span></p>
              </div>
            );
          }} cursor={{ fill: 'rgba(17, 24, 39, 0.03)' }} />
          <Bar dataKey="v" radius={[3, 3, 0, 0]} maxBarSize={20}>
            {data.map((entry) => (
              <Cell key={entry.label}
                    fill={entry.raw === 0 ? '#F3F4F6' : entry.raw === max ? '#FFE815' : '#111827'} />
            ))}
            <LabelList dataKey="raw" position="top"
                       content={({ x, y, width, value }) => (
                         value === max && value > 0
                           ? <text x={x + width / 2} y={y - 6} textAnchor="middle" fontSize="11" fontWeight="700" fill="#111827">{value}</text>
                           : null
                       )} />
          </Bar>
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
};

            </div>
          </div>
          <div>
            <p className="mb-2 text-xs font-bold text-gray-500">商品流量排行（前 5）</p>
            <RankList
              rows={data.traffic.top}
              maxOf={(r) => r.view}
              valueOf={(r) => `${fmtInt(r.view)} 浏览`}
              extra={(r) => `曝光 ${fmtInt(r.exposure)} · 想要 ${fmtInt(r.want)}`}
            />
          </div>
        </div>
      </>
    ) : (
      <InlineNote>{data.trafficNote}</InlineNote>
    )}
  </Section>
);

const SectionOrders = ({ data }) => {
  const [term, setTerm] = useState('');
  const rows = useMemo(() => {
    const t = term.trim().toLowerCase();
    if (!t) return data.orders;
    return data.orders.filter((o) => [o.id, o.buyer, o.item].some((v) => String(v).toLowerCase().includes(t)));
  }, [term, data]);
  return (
    <Section no="07" title="订单清单" conclusion={data.ordersConclusion}>
      <div className="relative mb-4 w-72">
        <Icon name="search" size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-300" />
        <input
          value={term}
          onChange={(e) => setTerm(e.target.value)}
          placeholder="搜索订单号、商品或买家"
          aria-label="搜索订单"
          className="w-full rounded-lg border border-gray-200 bg-white py-2 pl-9 pr-3 text-[13px] outline-none placeholder:text-gray-300 focus:border-gray-900"
        />
      </div>
      <table className="w-full text-left text-[13px]">
        <thead>
          <tr className="border-b border-gray-100 text-xs text-gray-400">
            <th className="pb-2.5 font-medium">商品 / 订单号</th>
            <th className="pb-2.5 font-medium">买家</th>
            <th className="pb-2.5 text-right font-medium">金额</th>
            <th className="pb-2.5 pl-6 font-medium">状态</th>
            <th className="pb-2.5 text-right font-medium">时间</th>
          </tr>
        </thead>
        <tbody className="divide-y divide-gray-50">
          {rows.length === 0 ? (
            <tr><td colSpan={5} className="py-10 text-center text-gray-300">没有匹配的订单</td></tr>
          ) : rows.map((o) => (
            <tr key={o.id}>
              <td className="max-w-[300px] py-3 pr-3">
                <p className="truncate font-bold text-gray-900" title={o.item}>{o.item}</p>
                <p className="mt-0.5 font-mono text-xs text-gray-400">{o.id}</p>
              </td>
              <td className="py-3 text-gray-700">{o.buyer}</td>
              <td className="py-3 text-right font-bold text-gray-900">¥{fmtMoney(o.amount)}</td>
              <td className="py-3 pl-6"><StatusChip status={o.status} /></td>
              <td className="py-3 text-right text-gray-400">{o.time}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </Section>
  );
};

/* ---------------- 页面 ---------------- */
const App = () => {
  const [scale, setScale] = useState('now');
  const data = DATA[scale];
  return (
    <div className="flex min-h-screen">
      <Sidebar />
      <main className="min-w-0 flex-1">
        <div className="mx-auto max-w-[920px] px-6 py-10">
          <div className="rounded-[24px] border border-black/[0.03] bg-white px-12 py-11 shadow-[0_8px_24px_rgba(0,0,0,0.04)]">
            <ReportHeader data={data} scale={scale} onScale={setScale} />
            <div className="mt-10">
              <SectionRevenue data={data} />
              <SectionItems data={data} />
              <SectionStatus data={data} />
              <SectionTiming data={data} />
              <SectionBuyers data={data} />
              <SectionTraffic data={data} />
              <SectionOrders data={data} />
            </div>
            <footer className="mt-10 border-t border-gray-100 pt-5 text-xs text-gray-300">
              报告由系统根据订单快照自动生成 · 数据为脱敏演示 · 生成于 2026-08-12
            </footer>
          </div>
        </div>
      </main>
      {/* 方案标注徽章 */}
      <div className="fixed right-4 top-4 z-50 rounded-full border border-gray-200 bg-white/95 px-3.5 py-1.5 text-xs font-bold text-gray-700 shadow-md">
        方案 C · 经营报告流
      </div>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
