/* ---------------- 压噪柱状图（0 值极浅底座 + 峰值黄柱顶标数值） ---------------- */
function PressureBar({ data, height = 168, xKey, xInterval = 0, TipComp }) {
  const peakIdx = data.reduce((m, r, i, arr) => (r.raw > arr[m].raw ? i : m), 0);
  const peakVal = data[peakIdx].raw;
  const disp = data.map((r) => ({ ...r, disp: r.raw === 0 ? Math.max(peakVal * 0.045, 0.001) : r.raw }));
  return (
    <ResponsiveContainer width="100%" height={height}>
      <BarChart data={disp} margin={{ top: 20, right: 4, left: 4, bottom: 0 }} barCategoryGap="26%">
        <XAxis dataKey={xKey} tick={{ fontSize: 11, fill: '#9CA3AF' }} axisLine={{ stroke: '#F3F4F6' }} tickLine={false} interval={xInterval} dy={4} />
        <YAxis hide domain={[0, (max) => Math.ceil(max * 1.12)]} />
        <Tooltip content={<TipComp />} cursor={{ fill: 'rgba(17,24,39,0.04)' }} />
        <Bar dataKey="disp" radius={[3, 3, 0, 0]}>
          {disp.map((r, i) => (
            <Cell key={i} fill={r.raw === 0 ? '#F1F3F6' : i === peakIdx ? '#FFE815' : '#C9D1DC'} />
          ))}
          <LabelList dataKey="raw" content={(props) => (
            props.index === peakIdx && peakVal > 0
              ? <text x={props.x + props.width / 2} y={props.y - 7} textAnchor="middle" fontSize="11" fontWeight="600" fill="#111827">{peakVal}</text>
              : null
          )} />
        </Bar>
      </BarChart>
    </ResponsiveContainer>
  );
}

      <div className="text-xs text-gray-400 mb-1">买家贡献榜 · 前 5</div>
      <div className="divide-y divide-gray-50">
        {b.top.map((t, i) => (
          <div key={t.n} className="flex items-center gap-2.5 py-2">
            <span className="w-4 text-center text-[11px] text-gray-400">{i + 1}</span>
            <span className="flex-1 min-w-0 truncate text-[13px] text-gray-700" title={t.n}>{t.n}</span>
            <span className="shrink-0 text-[11px] text-gray-400">{t.o} 单</span>
            <span className="shrink-0 w-[64px] text-right text-[13px] font-medium text-gray-900">¥{fmtMoney(t.a)}</span>
          </div>
        ))}
      </div>
      <div className="pt-2 text-[11px] text-gray-400 border-t border-gray-50">{b.rest}</div>
    </section>
  );
}

/* ---------------- 右栏：商品流量 ---------------- */
function TrafficSection({ data }) {
  const t = data.traffic;
  return (
    <section className="px-6 py-6">
      <SecHead icon="eye" title="商品流量"
        extra={
          t
            ? <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-emerald-500" />采集中</span>
            : <span className="inline-flex items-center gap-1.5"><span className="w-1.5 h-1.5 rounded-full bg-gray-300" />未启用</span>
        } />
      {t ? (
        <div>
          <div className="grid grid-cols-3 divide-x divide-gray-100 mb-3">
            <div className="pr-3">
              <div className="text-[18px] font-bold text-gray-900">{fmtInt(t.expo)}</div>
              <div className="text-[11px] text-gray-400 mt-0.5">曝光增量</div>
            </div>
            <div className="px-3">
              <div className="text-[18px] font-bold text-gray-900">{fmtInt(t.views)}</div>
              <div className="text-[11px] text-gray-400 mt-0.5">浏览增量</div>
            </div>
            <div className="pl-3">
              <div className="text-[18px] font-bold text-gray-900">{fmtInt(t.wants)}</div>
              <div className="text-[11px] text-gray-400 mt-0.5">想要增量</div>
            </div>
          </div>
          <div className="mb-4">
            <Hint>可比观测窗口 {t.windows} 个 · 覆盖 {t.days} 天，增量为相邻窗口差值汇总。</Hint>
          </div>
          <div className="text-xs text-gray-400 mb-1">近 6 个观测窗口 · 曝光增量</div>
          <div className="h-[112px]">
            <ResponsiveContainer width="100%" height={112}>
              <BarChart data={t.series} margin={{ top: 6, right: 2, left: 2, bottom: 0 }}>
                <XAxis dataKey="label" tick={{ fontSize: 10, fill: '#9CA3AF' }} axisLine={{ stroke: '#F3F4F6' }} tickLine={false} interval={0} dy={3} />
                <YAxis hide />
                <Tooltip content={<TrafficTip />} cursor={{ fill: 'rgba(17,24,39,0.04)' }} />
                <Bar dataKey="expo" fill="#3B82F6" radius={[3, 3, 0, 0]} barSize={22} />
              </BarChart>
            </ResponsiveContainer>
          </div>
          <div className="text-xs text-gray-400 mt-4 mb-2">商品流量排行 · 曝光前 5</div>
          <div className="space-y-2.5">
            {t.rank.map((r, i) => {
              const max = t.rank[0].v;
              return (
                <div key={r.n} className="flex items-center gap-2.5">
                  <span className="w-4 text-center text-[11px] text-gray-400">{i + 1}</span>
                  <span className="flex-1 min-w-0 truncate text-[12.5px] text-gray-700" title={r.n}>{r.n}</span>
                  <div className="w-[72px] h-1 rounded-full bg-gray-100 overflow-hidden shrink-0">
                    <div className="h-full rounded-full bg-blue-500" style={{ width: (r.v / max) * 100 + '%' }} />
                  </div>
                  <span className="shrink-0 w-[46px] text-right text-[12px] font-medium text-gray-900">{fmtInt(r.v)}</span>
                </div>
              );
            })}
          </div>
        </div>
      ) : (
        <div className="rounded-[12px] bg-gray-50/60 border border-gray-100 px-5 py-8 flex flex-col items-center gap-2.5 text-center">
          <Icon name="eyeOff" size={22} className="text-gray-300" />
          <span className="text-[13px] text-gray-400">商品流量采集尚未启用</span>
          <span className="text-[11px] leading-relaxed text-gray-300 max-w-[240px]">
            真实商品流量采集尚未启用——卖家后台适配器完成真实账号验收前，系统不会生成或推测流量数据
          </span>
        </div>
      )}
    </section>
  );
}

/* ---------------- 底部：成交爆品榜 ---------------- */
function HotSection({ data }) {
  return (
    <section className="px-7 py-6 border-b border-gray-100">
      <SecHead icon="fire" title="成交爆品榜" extra="按所选范围成交单数排序" />
      <table className="w-full text-[13px]">
        <thead>
          <tr className="text-left text-xs text-gray-400 bg-gray-50/60">
            <th className="font-normal py-2.5 pl-3 pr-2 w-[56px] rounded-l-[8px]">排名</th>
            <th className="font-normal py-2.5 px-2">商品</th>
            <th className="font-normal py-2.5 px-2 w-[110px] text-right">成交单数</th>
            <th className="font-normal py-2.5 px-2 w-[130px] text-right">成交金额</th>
            <th className="font-normal py-2.5 px-2 w-[110px] text-right">客单价</th>
            <th className="font-normal py-2.5 pl-2 pr-3 w-[130px] text-right rounded-r-[8px]">较上期</th>
          </tr>
        </thead>
        <tbody>
          {data.hot.map((h, i) => (
            <tr key={h.n} className="border-b border-gray-50 last:border-b-0">
              <td className="py-3 pl-3 pr-2">
                <span className={'w-6 h-6 rounded-[7px] inline-flex items-center justify-center text-[12px] font-semibold ' +
                  (i === 0 ? 'bg-[#FFE815] text-gray-900' : i < 3 ? 'bg-gray-900 text-white' : 'bg-gray-100 text-gray-500')}>
                  {i + 1}
                </span>
              </td>
              <td className="py-3 px-2 max-w-0">
                <span className="block truncate text-gray-800" title={h.n}>{h.n}</span>
              </td>
              <td className="py-3 px-2 text-right font-medium text-gray-900">{fmtInt(h.o)} 单</td>
              <td className="py-3 px-2 text-right font-medium text-gray-900">¥{fmtMoney(h.a)}</td>
              <td className="py-3 px-2 text-right text-gray-500">¥{fmtMoney(h.avg)}</td>
              <td className="py-3 pl-2 pr-3 text-right">
                {h.mom.type === 'new'
                  ? <span className="inline-flex items-center h-[22px] px-2 rounded-full border border-gray-200 bg-gray-50 text-[11px] font-medium text-gray-500">新品</span>
                  : <MomBadge mom={h.mom} />}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </section>
  );
}

/* ---------------- 底部：订单明细 ---------------- */
function OrdersSection({ data }) {
  const [q, setQ] = useState('');
  const rows = useMemo(() => {
    const kw = q.trim().toLowerCase();
    if (!kw) return data.orderRows;
    return data.orderRows.filter((r) =>
      (r.no + r.buyer + r.prod).toLowerCase().includes(kw));
  }, [q, data]);
  return (
    <section className="px-7 py-6 pb-8">
      <div className="flex items-center justify-between mb-4 gap-4">
        <div className="flex items-center gap-2">
          <Icon name="list" size={16} className="text-gray-400" />
          <h3 className="text-[14px] font-semibold text-gray-900">参与统计的订单</h3>
          <span className="text-xs text-gray-400 ml-1">{data.ordersNote}</span>
        </div>
        <div className="relative w-[280px]">
          <Icon name="search" size={15} className="text-gray-400 absolute left-3 top-1/2 -translate-y-1/2" />
          <input
            value={q}
            onChange={(e) => setQ(e.target.value)}
            placeholder="搜索订单号 / 买家 / 商品"
            className="w-full h-9 pl-9 pr-3 rounded-[10px] border border-gray-200 bg-gray-50 text-[13px] text-gray-800 placeholder:text-gray-400 outline-none transition-colors focus:bg-white focus:border-gray-300" />
        </div>
      </div>
      <table className="w-full text-[13px]">
        <thead>
          <tr className="text-left text-xs text-gray-400 bg-gray-50/60">
            <th className="font-normal py-2.5 pl-3 pr-2 w-[170px] rounded-l-[8px]">订单号</th>
            <th className="font-normal py-2.5 px-2 w-[140px]">买家</th>
            <th className="font-normal py-2.5 px-2">商品</th>
            <th className="font-normal py-2.5 px-2 w-[100px] text-right">金额</th>
            <th className="font-normal py-2.5 px-2 w-[100px] text-center">状态</th>
            <th className="font-normal py-2.5 pl-2 pr-3 w-[120px] text-right rounded-r-[8px]">时间</th>
          </tr>
        </thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.no} className="border-b border-gray-50 last:border-b-0 hover:bg-gray-50/50 transition-colors">
              <td className="py-3 pl-3 pr-2 text-gray-500">{r.no}</td>
              <td className="py-3 px-2 text-gray-800">{r.buyer}</td>
              <td className="py-3 px-2 max-w-0">
                <span className="block truncate text-gray-600" title={r.prod}>{r.prod}</span>
              </td>
              <td className="py-3 px-2 text-right font-medium text-gray-900">¥{fmtMoney(r.amt)}</td>
              <td className="py-3 px-2 text-center">
                <span className={'inline-flex items-center h-[22px] px-2.5 rounded-full text-[11px] font-medium ' + statusBadgeCls(r.st)}>
                  {r.st}
                </span>
              </td>
              <td className="py-3 pl-2 pr-3 text-right text-gray-400">{r.t}</td>
            </tr>
          ))}
          {rows.length === 0 ? (
            <tr>
              <td colSpan="6" className="py-10 text-center text-xs text-gray-400">未找到匹配「{q}」的订单</td>
            </tr>
          ) : null}
        </tbody>
      </table>
    </section>
  );
}

/* ---------------- 应用 ---------------- */

  const [dsKey, setDsKey] = useState('current');
  const data = DS[dsKey];
  return (
    <div className="min-h-screen py-6 px-5">
      {/* 方案徽章 */}
      <div className="fixed top-3 right-3 z-50 flex items-center gap-1.5 bg-gray-900/95 text-white text-xs pl-2.5 pr-3 h-7 rounded-full shadow-lg">

        方案 A · 连续工作台
      </div>

      <div className="max-w-[1400px] mx-auto">
        {/* 应用壳：一体圆角，一层柔和阴影 */}
        <div className="flex items-stretch rounded-[24px]"
          style={{ boxShadow: '0 18px 50px -18px rgba(17,24,39,0.14), 0 2px 6px rgba(17,24,39,0.04)' }}>
          <Sidebar />
          {/* 连续白色表面：内部只用分隔线与浅灰分区组织 */}
          <main className="flex-1 min-w-0 bg-white rounded-r-[24px]">
            <Header data={data} dsKey={dsKey} setDsKey={setDsKey} />
            <KpiStrip data={data} />
            <div className="grid grid-cols-3 border-b border-gray-100">

                <CitySection data={data} />

              <div className="flex flex-col min-w-0">

          </main>

        <p className="text-center text-xs text-gray-400 mt-5">

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
