name: Native Helper Packages

on:
  workflow_dispatch:
  push:
    tags:
      - 'native-helper-v*'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: xianyu-native-browser-helper-macos-arm64-1.0.2
            command: >-
              python -m PyInstaller --clean --noconfirm
              native_browser_helper/packaging/macos.spec
            path: dist/xianyu-native-browser-helper-macos-arm64-1.0.2.zip
          - os: windows-latest
            artifact: xianyu-native-browser-helper-windows-x64-1.0.2
            command: >-
              python -m PyInstaller --clean --noconfirm
              native_browser_helper/packaging/windows.spec
            path: dist/xianyu-native-browser-helper-windows-x64-1.0.2.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyinstaller -r native_browser_helper/requirements.txt
      - shell: bash
        run: ${{ matrix.command }}
      - if: runner.os == 'macOS'
        run: >-
          python native_browser_helper/scripts/package_macos.py
          --app dist/XianyuNativeHelper.app
          --output dist/xianyu-native-browser-helper-macos-arm64-1.0.2.zip
          --no-public-copy
      - if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Compress-Archive -Path dist/XianyuNativeHelper.exe
          -DestinationPath dist/xianyu-native-browser-helper-windows-x64-1.0.2.zip
      - if: runner.os == 'macOS'
        run: >-
          python native_browser_helper/scripts/verify_package.py
          --platform macos
          --arch arm64
          --archive dist/xianyu-native-browser-helper-macos-arm64-1.0.2.zip
      - if: runner.os == 'macOS'
        name: Verify macOS install, persistence, health, status, and uninstall
        shell: bash
        env:
          XMC_HELPER_INSTALL_ROOT: ${{ runner.temp }}/native-helper-install
          XMC_HELPER_LAUNCH_AGENT_PATH: ${{ runner.temp }}/native-helper-launchagents/com.cxywjx.xianyu-native-helper.plist
          XMC_HELPER_STATE_DIR: ${{ runner.temp }}/native-helper-state
          XMC_HELPER_KEYCHAIN_SERVICE: xianyu-native-helper-ci-${{ github.run_id }}-${{ github.run_attempt }}
          XMC_HELPER_KEYCHAIN_ACCOUNT: native-helper-ci
        run: |
          set -euo pipefail
          source_executable="dist/XianyuNativeHelper.app/Contents/MacOS/XianyuNativeHelper"
          installed_executable="$XMC_HELPER_INSTALL_ROOT/XianyuNativeHelper.app/Contents/MacOS/XianyuNativeHelper"
          launch_domain="gui/$(id -u)"
          service_label="com.cxywjx.xianyu-native-helper"
          health_file="$RUNNER_TEMP/native-helper-health.json"

          cleanup() {
            set +e
            launchctl bootout "$launch_domain/$service_label" >/dev/null 2>&1
            security delete-generic-password \
              -a "$XMC_HELPER_KEYCHAIN_ACCOUNT" \
              -s "$XMC_HELPER_KEYCHAIN_SERVICE" >/dev/null 2>&1
            rm -rf \
              "$XMC_HELPER_INSTALL_ROOT" \
              "$(dirname "$XMC_HELPER_LAUNCH_AGENT_PATH")" \
              "$XMC_HELPER_STATE_DIR"
          }
          trap cleanup EXIT

          "$source_executable" --install --no-ui --port 17891 \
            --result-file "$RUNNER_TEMP/native-helper-install.json"
          test -x "$installed_executable"
          test -f "$XMC_HELPER_LAUNCH_AGENT_PATH"
          codesign --verify --deep --strict --verbose=2 \
            "$XMC_HELPER_INSTALL_ROOT/XianyuNativeHelper.app"
          "$installed_executable" --status --no-ui --port 17891 \
            --result-file "$RUNNER_TEMP/native-helper-status.json"

          ready=0
          for attempt in {1..100}; do
            if curl -fsS http://127.0.0.1:17891/health >"$health_file"; then
              ready=1
              break
            fi
            sleep 0.1
          done
          test "$ready" -eq 1

          EXPECTED_INSTALL_PATH="$XMC_HELPER_INSTALL_ROOT/XianyuNativeHelper.app" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          expected = os.environ["EXPECTED_INSTALL_PATH"]
          for name in ("native-helper-install.json", "native-helper-status.json"):
              payload = json.loads((root / name).read_text())
              assert payload["version"] == "1.0.2"
              assert payload["installed"] is True
              assert payload["startup_registered"] is True
              assert payload["running"] is True
              assert payload["install_path"] == expected
          health = json.loads((root / "native-helper-health.json").read_text())
          assert health == {
              "ok": True,
              "service": "xianyu-native-browser-helper",
              "version": "1.0.2",
          }
          PY

          launchctl bootout "$launch_domain/$service_label"
          stopped=0
          for attempt in {1..100}; do
            if ! curl -fsS http://127.0.0.1:17891/health >/dev/null 2>&1; then
              stopped=1
              break
            fi
            sleep 0.1
          done
          test "$stopped" -eq 1
          launchctl bootstrap "$launch_domain" "$XMC_HELPER_LAUNCH_AGENT_PATH"

          restarted=0
          for attempt in {1..100}; do
            if curl -fsS http://127.0.0.1:17891/health >"$health_file"; then
              restarted=1
              break
            fi
            sleep 0.1
          done
          test "$restarted" -eq 1
          "$installed_executable" --status --no-ui --port 17891 \
            --result-file "$RUNNER_TEMP/native-helper-restarted-status.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "native-helper-restarted-status.json").read_text()
          )
          assert payload["installed"] is True
          assert payload["startup_registered"] is True
          assert payload["running"] is True
          PY

          "$source_executable" --uninstall --no-ui --port 17891 \
            --result-file "$RUNNER_TEMP/native-helper-uninstall.json"
          test ! -e "$XMC_HELPER_INSTALL_ROOT/XianyuNativeHelper.app"
          test ! -e "$XMC_HELPER_LAUNCH_AGENT_PATH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "native-helper-uninstall.json").read_text()
          )
          assert payload["installed"] is False
          assert payload["startup_registered"] is False
          assert payload["running"] is False
          PY
      - if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python native_browser_helper/scripts/verify_package.py
          --platform windows
          --archive dist/xianyu-native-browser-helper-windows-x64-1.0.2.zip
      - if: runner.os == 'Windows'
        name: Verify Windows install, persistence, health, status, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'native-helper-localappdata'
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'native-helper-appdata'
          $env:XMC_HELPER_STATE_DIR = Join-Path $env:RUNNER_TEMP 'native-helper-state'
          $sourceExecutable = Join-Path $PWD 'dist/XianyuNativeHelper.exe'
          $installedExecutable = Join-Path $env:LOCALAPPDATA 'XianyuNativeHelper/XianyuNativeHelper-1.0.2.exe'
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $runName = 'XianyuNativeBrowserHelper'

          function Wait-HelperHealth {
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:17891/health' -TimeoutSec 1
                if ($health.ok -and $health.version -eq '1.0.2') { return $health }
              } catch {
                Start-Sleep -Milliseconds 100
              }
            }
            throw 'Windows native helper health check failed'
          }

          try {
            $install = Start-Process -FilePath $sourceExecutable `
              -ArgumentList @(
                '--install', '--no-ui', '--port', '17891',
                '--result-file', (Join-Path $env:RUNNER_TEMP 'native-helper-install.json')
              ) -PassThru
            # Start-Process -Wait also waits for the persistent helper child process.
            # Wait only for the one-shot installer process itself.
            $install.WaitForExit()
            if ($install.ExitCode -ne 0) { throw 'Windows native helper install failed' }
            if (-not (Test-Path -LiteralPath $installedExecutable -PathType Leaf)) {
              throw 'Windows native helper installed executable is missing'
            }
            $runCommand = (Get-ItemProperty -LiteralPath $runKey -Name $runName).$runName
            if (-not $runCommand.Contains($installedExecutable) -or -not $runCommand.Contains('--serve')) {
              throw 'Windows current-user startup registration is invalid'
            }
            $health = Wait-HelperHealth

            $originalPidRecord = Get-Content -Raw -LiteralPath `
              (Join-Path $env:XMC_HELPER_STATE_DIR 'helper.pid') | ConvertFrom-Json
            $duplicate = Start-Process -FilePath $installedExecutable `
              -ArgumentList @(
                '--serve', '--port', '17891', '--state-dir', $env:XMC_HELPER_STATE_DIR
              ) -Wait -PassThru
            if ($duplicate.ExitCode -ne 0) { throw 'Windows duplicate helper probe failed' }
            $unchangedPidRecord = Get-Content -Raw -LiteralPath `
              (Join-Path $env:XMC_HELPER_STATE_DIR 'helper.pid') | ConvertFrom-Json
            if ([int]$unchangedPidRecord.pid -ne [int]$originalPidRecord.pid) {
              throw 'Windows duplicate helper replaced the active service'
            }
            if ($null -eq (Get-Process -Id ([int]$originalPidRecord.pid) -ErrorAction SilentlyContinue)) {
              throw 'Windows duplicate helper terminated the active service'
            }
            $health = Wait-HelperHealth

            $status = Start-Process -FilePath $installedExecutable `
              -ArgumentList @(
                '--status', '--no-ui', '--port', '17891',
                '--result-file', (Join-Path $env:RUNNER_TEMP 'native-helper-status.json')
              ) -Wait -PassThru
            if ($status.ExitCode -ne 0) { throw 'Windows native helper status failed' }
            $statusPayload = Get-Content -Raw -LiteralPath `
              (Join-Path $env:RUNNER_TEMP 'native-helper-status.json') | ConvertFrom-Json
            if (-not $statusPayload.installed -or -not $statusPayload.startup_registered -or -not $statusPayload.running) {
              throw 'Windows native helper status is invalid'
            }

            $pidRecord = Get-Content -Raw -LiteralPath (Join-Path $env:XMC_HELPER_STATE_DIR 'helper.pid') | ConvertFrom-Json
            Stop-Process -Id ([int]$pidRecord.pid) -Force
            Wait-Process -Id ([int]$pidRecord.pid) -ErrorAction SilentlyContinue
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              try {
                Invoke-RestMethod -Uri 'http://127.0.0.1:17891/health' -TimeoutSec 1 | Out-Null
                Start-Sleep -Milliseconds 100
              } catch {
                break
              }
            }
            $restart = Start-Process -FilePath $installedExecutable `
              -ArgumentList @(
                '--serve', '--port', '17891', '--state-dir', $env:XMC_HELPER_STATE_DIR
              ) -PassThru
            $health = Wait-HelperHealth
            $restartedStatus = Start-Process -FilePath $installedExecutable `
              -ArgumentList @(
                '--status', '--no-ui', '--port', '17891',
                '--result-file', (Join-Path $env:RUNNER_TEMP 'native-helper-restarted-status.json')
              ) -Wait -PassThru
            if ($restartedStatus.ExitCode -ne 0) { throw 'Windows restarted helper status failed' }
            $restartedPayload = Get-Content -Raw -LiteralPath `
              (Join-Path $env:RUNNER_TEMP 'native-helper-restarted-status.json') | ConvertFrom-Json
            if (-not $restartedPayload.installed -or -not $restartedPayload.startup_registered -or -not $restartedPayload.running) {
              throw 'Windows restarted helper status is invalid'
            }

            $uninstall = Start-Process -FilePath $sourceExecutable `
              -ArgumentList @(
                '--uninstall', '--no-ui', '--port', '17891',
                '--result-file', (Join-Path $env:RUNNER_TEMP 'native-helper-uninstall.json')
              ) -Wait -PassThru
            if ($uninstall.ExitCode -ne 0) { throw 'Windows native helper uninstall failed' }
            if (Test-Path -LiteralPath $installedExecutable) {
              throw 'Windows native helper executable remained after uninstall'
            }
            $remainingRunValue = Get-ItemProperty `
              -LiteralPath $runKey -Name $runName -ErrorAction SilentlyContinue
            if ($null -ne $remainingRunValue) {
              throw 'Windows startup registration remained after uninstall'
            }
            $uninstallPayload = Get-Content -Raw -LiteralPath `
              (Join-Path $env:RUNNER_TEMP 'native-helper-uninstall.json') | ConvertFrom-Json
            if ($uninstallPayload.installed -or $uninstallPayload.startup_registered -or $uninstallPayload.running) {
              throw 'Windows native helper uninstall status is invalid'
            }
          } finally {
            $pidPath = Join-Path $env:XMC_HELPER_STATE_DIR 'helper.pid'
            if (Test-Path -LiteralPath $pidPath) {
              try {
                $record = Get-Content -Raw -LiteralPath $pidPath | ConvertFrom-Json
                Stop-Process -Id ([int]$record.pid) -Force -ErrorAction SilentlyContinue
              } catch {}
            }
            Remove-ItemProperty -LiteralPath $runKey -Name $runName -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force -LiteralPath $env:LOCALAPPDATA -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force -LiteralPath $env:APPDATA -ErrorAction SilentlyContinue
            Remove-Item -Recurse -Force -LiteralPath $env:XMC_HELPER_STATE_DIR -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
