name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: python -m py_compile Start.py app_factory.py application_runtime.py api_routers.py auth_email_service.py auth_registration_service.py settings_service.py db_manager.py schema_migrations.py security_utils.py session_registry.py official_login_sessions.py repositories/auth_repository.py repositories/runtime_session_repository.py services/auth_service.py ai_provider_service.py ai_reply_engine.py auto_rate_service.py backfill_auto_rates.py account_session_refresh.py order_sync_service.py item_metric_service.py item_metric_scheduler.py invite_bridge.py invite_bridge_poller.py backfill_order_snapshots.py browser_extension_pairing.py cloudflared_watchdog.py reply_server.py XianyuAutoAsync.py utils/browser_interaction.py utils/xianyu_official_login.py utils/xianyu_session_probe.py utils/qr_login.py utils/qr_verification_browser.py utils/xianyu_l3_memory.py utils/outbound_http.py utils/outbound_smtp.py utils/outbound_dns.py utils/xianyu_message.py utils/xianyu_slider_stealth.py utils/verification_images.py
      - run: docker compose -p xianyu-manager config --quiet
        env:
          ADMIN_PASSWORD: ci-placeholder
          JWT_SECRET_KEY: ci-placeholder
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm audit --audit-level=high
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm test
      - working-directory: frontend
        run: npm run test:extension
      - working-directory: frontend
        run: npm run build
      - working-directory: frontend
        run: npm run verify:build
      - working-directory: frontend
        run: npm run verify:extension
